name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - name: Run unit tests
        run: go test -race ./...
