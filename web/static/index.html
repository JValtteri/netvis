<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVis - Network Traffic Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="info">
        <div id="infoHeader">
            <h1>NetVis</h1>
            <button id="legendToggle" aria-label="Toggle legend" title="Toggle legend">&minus;</button>
        </div>
        <div id="stats">Hosts: <span id="hostCount">0</span> | Connections: <span id="edgeCount">0</span></div>
        <div class="legend-group">
            <div class="legend-title">Hosts</div>
            <div class="legend-row">
                <span class="legend-item"><span class="color" style="background:#50c878"></span> Local</span>
                <span class="legend-item"><span class="color" style="background:#4a90e2"></span> Remote</span>
                <span class="legend-item"><span class="color" style="background:#666"></span> No traffic</span>
            </div>
        </div>
        <div class="legend-group">
            <div class="legend-title">Protocols</div>
            <div class="legend-row">
                <span class="legend-item"><span class="color" style="background:#4a90e2"></span> TCP</span>
                <span class="legend-item"><span class="color" style="background:#50c878"></span> UDP</span>
                <span class="legend-item"><span class="color" style="background:#f39c12"></span> ICMP</span>
                <span class="legend-item"><span class="color" style="background:#e74c3c"></span> OTHER</span>
            </div>
        </div>
    </div>
    <div id="menu">
        <button id="menuToggle" aria-label="Toggle settings">&#9776;</button>
        <div id="menuPanel" class="hidden">
            <h2>Settings</h2>

            <label class="slider-row" for="attractLocalLocal">
                <span>Attraction local&harr;local <output id="attractLocalLocalValue"></output></span>
                <input type="range" id="attractLocalLocal" min="0" max="1" step="0.001" value="0.100">
            </label>
            <label class="slider-row" for="attractLocalExternal">
                <span>Attraction local&harr;external <output id="attractLocalExternalValue"></output></span>
                <input type="range" id="attractLocalExternal" min="0" max="1" step="0.001" value="0.660">
            </label>
            <label class="slider-row" for="attractExternalExternal">
                <span>Attraction external&harr;external <output id="attractExternalExternalValue"></output></span>
                <input type="range" id="attractExternalExternal" min="0" max="1" step="0.001" value="0.020">
            </label>

            <label class="slider-row" for="packetSpeed">
                <span>Packet speed <output id="packetSpeedValue"></output></span>
                <input type="range" id="packetSpeed" min="0.001" max="0.02" step="0.001" value="0.005">
            </label>
            <label class="slider-row" for="packetSize">
                <span>Packet size <output id="packetSizeValue"></output></span>
                <input type="range" id="packetSize" min="0.1" max="3" step="0.1" value="0.3">
            </label>

            <label class="slider-row" for="minHostSize">
                <span>Min host size <output id="minHostSizeValue"></output></span>
                <input type="range" id="minHostSize" min="2" max="60" step="1" value="5">
            </label>
            <label class="slider-row" for="maxHostSize">
                <span>Max host size <output id="maxHostSizeValue"></output></span>
                <input type="range" id="maxHostSize" min="10" max="120" step="1" value="44">
            </label>

            <label class="slider-row" for="glowDuration">
                <span>Active glow duration (s) <output id="glowDurationValue"></output></span>
                <input type="range" id="glowDuration" min="0" max="300" step="5" value="60">
            </label>
            <label class="slider-row" for="passiveTimeout">
                <span>Passive after (s) <output id="passiveTimeoutValue"></output></span>
                <input type="range" id="passiveTimeout" min="10" max="600" step="10" value="120">
            </label>

            <button id="removeSilent">Remove silent hosts</button>
            <button id="removePassive">Remove passive hosts</button>
        </div>
    </div>
    <div id="toast"></div>
    <canvas id="canvas"></canvas>
    <script src="js/app.js"></script>
</body>
</html>
