<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVis - Network Traffic Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="info">
        <div id="infoHeader">
            <h1>NetVis</h1>
            <button id="legendToggle" aria-label="Toggle legend" title="Toggle legend">&minus;</button>
        </div>
        <div id="stats">Hosts: <span id="hostCount">0</span> | Connections: <span id="edgeCount">0</span></div>
        <div class="legend-group">
            <div class="legend-title">Hosts</div>
            <div class="legend-row">
                <span class="legend-item"><span class="color" style="background:#50c878"></span> Local</span>
                <span class="legend-item"><span class="color" style="background:#4a90e2"></span> Remote</span>
                <span class="legend-item"><span class="color" style="background:#666"></span> No traffic</span>
            </div>
        </div>
        <div class="legend-group">
            <div class="legend-title">Protocols</div>
            <div class="legend-row">
                <span class="legend-item"><span class="color" style="background:#4a90e2"></span> TCP</span>
                <span class="legend-item"><span class="color" style="background:#50c878"></span> UDP</span>
                <span class="legend-item"><span class="color" style="background:#f39c12"></span> ICMP</span>
                <span class="legend-item"><span class="color" style="background:#e74c3c"></span> OTHER</span>
            </div>
        </div>
    </div>
    <div id="menu">
        <button id="menuToggle" aria-label="Toggle settings">&#9776;</button>
        <div id="menuPanel" class="hidden">
            <div class="menu-header">
                <h2>Settings</h2>
            </div>
            <div class="menu-scroll">
                <div class="menu-group">
                    <div class="menu-group-title">Attraction</div>
                    <label class="slider-row" for="attractLocalLocal">
                        <span>Local &harr; Local <output id="attractLocalLocalValue"></output></span>
                        <input type="range" id="attractLocalLocal" min="0" max="1" step="0.001" value="0.100">
                    </label>
                    <label class="slider-row" for="attractLocalExternal">
                        <span>Local &harr; External <output id="attractLocalExternalValue"></output></span>
                        <input type="range" id="attractLocalExternal" min="0" max="1" step="0.001" value="0.660">
                    </label>
                    <label class="slider-row" for="attractExternalExternal">
                        <span>External &harr; External <output id="attractExternalExternalValue"></output></span>
                        <input type="range" id="attractExternalExternal" min="0" max="1" step="0.001" value="0.020">
                    </label>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Layout</div>
                    <label class="slider-row" for="angleDistribution">
                        <span>Edge spread force <output id="angleDistributionValue"></output></span>
                        <input type="range" id="angleDistribution" min="0" max="0.2" step="0.001" value="0.1">
                    </label>
                    <label class="slider-row" for="dampening">
                        <span>Dampening <output id="dampeningValue"></output></span>
                        <input type="range" id="dampening" min="0.1" max="5.0" step="0.01" value="2.0">
                    </label>
                    <label class="slider-row" for="constantDrag">
                        <span>Constant drag <output id="constantDragValue"></output></span>
                        <input type="range" id="constantDrag" min="0" max="2.0" step="0.01" value="1.0">
                    </label>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Stability thresholds</div>
                    <label class="slider-row" for="velocitySleepThreshold">
                        <span>Velocity sleep <output id="velocitySleepThresholdValue"></output></span>
                        <input type="range" id="velocitySleepThreshold" min="0" max="0.5" step="0.005" value="0.1">
                    </label>
                    <label class="slider-row" for="forceSleepThreshold">
                        <span>Force sleep <output id="forceSleepThresholdValue"></output></span>
                        <input type="range" id="forceSleepThreshold" min="0" max="0.2" step="0.001" value="0.01">
                    </label>
                    <label class="slider-row" for="positionSleepThreshold">
                        <span>Position sleep <output id="positionSleepThresholdValue"></output></span>
                        <input type="range" id="positionSleepThreshold" min="0" max="1" step="0.005" value="0.05">
                    </label>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Particles</div>
                    <label class="slider-row" for="packetSpeed">
                        <span>Packet speed <output id="packetSpeedValue"></output></span>
                        <input type="range" id="packetSpeed" min="0.001" max="0.02" step="0.001" value="0.005">
                    </label>
                    <label class="slider-row" for="packetSize">
                        <span>Packet size <output id="packetSizeValue"></output></span>
                        <input type="range" id="packetSize" min="0.1" max="3" step="0.1" value="0.3">
                    </label>
                </div>

                <div class="menu-group">
                    <div class="menu-group-title">Hosts</div>
                    <label class="slider-row" for="minHostSize">
                        <span>Min host size <output id="minHostSizeValue"></output></span>
                        <input type="range" id="minHostSize" min="2" max="60" step="1" value="5">
                    </label>
                    <label class="slider-row" for="maxHostSize">
                        <span>Max host size <output id="maxHostSizeValue"></output></span>
                        <input type="range" id="maxHostSize" min="10" max="120" step="1" value="44">
                    </label>
                    <label class="slider-row" for="collisionHalo">
                        <span>Collision halo <output id="collisionHaloValue"></output></span>
                        <input type="range" id="collisionHalo" min="0" max="100" step="1" value="20">
                    </label>
                    <label class="slider-row" for="glowDuration">
                        <span>Active glow duration (s) <output id="glowDurationValue"></output></span>
                        <input type="range" id="glowDuration" min="0" max="300" step="5" value="10">
                    </label>
                    <label class="slider-row" for="passiveTimeout">
                        <span>Passive after (s) <output id="passiveTimeoutValue"></output></span>
                        <input type="range" id="passiveTimeout" min="10" max="600" step="10" value="120">
                    </label>
                    <label class="checkbox-row" for="autoRemovePassive">
                        <input type="checkbox" id="autoRemovePassive">
                        Auto-remove passive hosts
                    </label>
                    <div class="menu-actions">
                        <button id="removeSilent">Remove silent hosts</button>
                        <button id="removePassive">Remove passive hosts</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    <div id="viewControls">
        <button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="fitView" aria-label="Fit to view" title="Fit to view">&#x26F6;</button>
    </div>
    <canvas id="canvas"></canvas>
    <script src="js/app.js"></script>
</body>
</html>
